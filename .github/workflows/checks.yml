# Checks that CI runs on every push and pull request.
#
# STATUS: this workflow is linted with actionlint (`uv run actionlint .github/workflows/checks.yml`) and has run on
# GitHub on the scratch branch `rebuild-ci`: every job passed on Linux (GCC 13), macOS (Xcode 16.4), Windows (VS 2022)
# and in the Linux CUDA compile job, so the Windows CPU code has been compiled and its tests run. The job
# `cuda-compile-windows` has not run yet. The commit rule stays the local gate,
# `uv run python tools/check_commit.py`.
#
# What each job proves:
#   rules         The C++ and CUDA sources are clang-format 23.1 clean, tools/check_rules.py reports no FAIL under
#                 src/, tests/ and docs/method-paper/, the pytest suite of tools/ passes, this file is accepted by
#                 actionlint, and the message of every pushed commit passes tools/check_message.py.
#   cpu           The strict CPU build (warnings as errors) of `<os>-<configuration>-cpu` configures and builds on Linux
#                 (GCC 13), macOS (Xcode 16.4) and Windows (VS 2022). A `release` job runs every test of the build (a
#                 CPU build registers only `cpu` tests), unit and functional. A `debug` job runs only the tests
#                 labelled `unit` and prints one line that says so: a functional program takes minutes in a debug
#                 build, and on a runner `stacked_borders_in_grid_pieces_functional_test` alone ran past the 1,800 s
#                 timeout of ctest on Windows. This is the speed `commit` of the local gate; the release job and the
#                 local `--speed full` run the functional tests. The Windows job is the only place the Windows CPU
#                 code is compiled; the Windows CUDA build is compiled by `cuda-compile-windows` and never run, and the
#                 owner's hardware run is its first run.
#   cuda-compile  Everything of `linux-release-cuda` compiles and links with nvcc, every `.cu` file and the `gpu` tests
#                 included, and the tests labelled `cpu` and `no_gpu` pass.
#
#   cuda-compile-windows
#                 Everything of `windows-release-cuda` compiles and links with nvcc 13.4 and MSVC (Visual Studio 2022)
#                 on a hosted runner: every target, every `.cu` file and the GPU tests included. It proves that the
#                 CUDA code builds with the Windows host compiler and the Windows CUDA runtime library, the build the
#                 owner's hardware run starts from (docs/gpu-runs.md). It runs NO test: the runner has no driver and no
#                 GPU, and the `cpu` tests of the build already run in the Linux and CPU jobs. It does not prove that
#                 the programs start (the runtime DLL, the driver) or that the code is right on a GPU. The toolkit is
#                 assembled from NVIDIA's redistributable archives, not from the installer: see the job.
#
# NO CI JOB RUNS GPU CODE. A hosted runner has no GPU, so GPU code is compiled, not run (docs/gpu-runs.md records the
# owner's hardware run). GPU tests are registered only in a CUDA build; the cpu jobs build none, and the CUDA job runs
# `ctest -L '^(cpu|no_gpu)$'` through the gate. ctest labels are regular expressions, so a bare `-L gpu` would also
# match `no_gpu`; CI never runs `^gpu$`.
#
# Left out on purpose:
#   paper   `check_commit.py --only paper` needs typst and the licensed fonts of the method paper; a hosted runner has
#           neither. The paper stays a local-gate check.
#   tidy    `--only tidy` needs the compile commands of a finished debug build; it stays a local-gate check.
# The workflow uses no secret and uploads no artifact.

name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same ref makes the older, superseded run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The message step reads the commits of the pushed range, so it needs their history.
          fetch-depth: 0

      # uv 0.13.7 is the version of tools/cuda-container/Dockerfile. It installs Python 3.13 (pyproject.toml's
      # requires-python) and the tools of uv.lock; `--frozen` never rewrites the lockfile.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install the tools of uv.lock
        run: uv sync --frozen

      # These two steps are the gate's own `format` and `rules` steps, at the speed `full`, so CI and the local gate cannot
      # disagree.
      - name: Gate step format
        run: uv run --frozen python tools/check_commit.py --speed full --only format

      - name: Gate step rules
        run: uv run --frozen python tools/check_commit.py --speed full --only rules

      # The gate's message step needs a clean tree and an upstream, which a runner has not, so this step reads the same
      # check over the commits sent: a push is `before..sha` when `before` exists and is an ancestor of `sha` (a new
      # branch has an all-zero `before`, and a forced push may leave one that is gone), a pull request is its own
      # commits, and any other run reads the commit it started on.
      - name: Message of every pushed commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          check=(uv run --frozen python tools/check_message.py)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            "${check[@]}" --range "$PULL_BASE..$PULL_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
              && git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA"; then
            "${check[@]}" --range "$PUSH_BEFORE..$GITHUB_SHA"
          else
            "${check[@]}" "$GITHUB_SHA"
          fi

  cpu:
    name: cpu ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        platform: [linux, macos, windows]
        include:
          # `toolchain` names the compiler and goes into the Conan cache key. Each runner's compiler is selected in
          # the "Select the compiler" steps below, never left to whatever the image makes the default.
          - platform: linux
            runner: ubuntu-24.04
            toolchain: gcc-13
          - platform: macos
            runner: macos-15
            toolchain: xcode-16.4
          - platform: windows
            runner: windows-2022
            toolchain: msvc-vs2022-14.44
    defaults:
      run:
        shell: pwsh
    env:
      PRESET: ${{ matrix.platform }}-${{ matrix.configuration }}-cpu
      BUILD_TYPE: ${{ matrix.configuration == 'debug' && 'Debug' || 'Release' }}
      # The gate keeps Conan's home under out/ too, so a profile of the runner's own is never read.
      CONAN_HOME: ${{ github.workspace }}/out/conan-home
      UV_PYTHON_PREFERENCE: only-managed
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # Linux. The ubuntu-24.04 image has GCC 13 (the distribution's default) beside other versions, as `gcc-13` and
      # `g++-13`. Naming them makes Conan's profile detection and CMake agree on GCC 13.
      - name: Select the compiler (GCC 13)
        if: runner.os == 'Linux'
        run: |
          'CC=gcc-13' >> $env:GITHUB_ENV
          'CXX=g++-13' >> $env:GITHUB_ENV

      # macOS. The macos-15 image has several Xcode versions under /Applications. DEVELOPER_DIR picks 16.4 for
      # `clang`, `clang++` and the SDK, whatever the image's default is.
      - name: Select the compiler (AppleClang from Xcode 16.4)
        if: runner.os == 'macOS'
        run: |
          'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> $env:GITHUB_ENV
          'CC=clang' >> $env:GITHUB_ENV
          'CXX=clang++' >> $env:GITHUB_ENV

      # Windows. The windows-2022 image has Visual Studio 2022 (MSVC 14.4x). Ninja, the generator of the presets,
      # does not start a developer environment, so this step runs VsDevCmd.bat for x64 (toolset 14.44, Windows SDK
      # 26100) and copies the compiler variables and the new PATH entries into the environment of the later steps.
      # The two cmd lines go through a temporary .cmd file: passing a quoted path to `cmd.exe /d /c` from pwsh 7
      # escapes the embedded quotes as `\"`, which cmd does not understand.
      # The toolset and SDK numbers are assumptions about the image; the step fails if vswhere finds no VS 2022.
      - name: Select the compiler (MSVC from Visual Studio 2022, x64)
        if: runner.os == 'Windows'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or !$installation) { throw 'Visual Studio 2022 C++ tools are required.' }
          $devCmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $script = Join-Path $env:RUNNER_TEMP 'vsdevcmd-environment.cmd'
          @(
            "@echo off",
            "call `"$devCmd`" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=14.44 -winsdk=10.0.26100.0",
            "if errorlevel 1 exit /b 1",
            "set"
          ) | Set-Content -Path $script -Encoding ascii
          $variables = & cmd.exe /d /c $script
          if ($LASTEXITCODE) { throw 'VsDevCmd failed.' }
          $nativeVariables = @(
            'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion',
            'VisualStudioVersion', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion',
            'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_VER', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH'
          )
          foreach ($line in $variables) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ($name -in $nativeVariables) {
                "$name=$value" >> $env:GITHUB_ENV
              }
              if ($name -eq 'Path') {
                $addedPaths = @($value -split ';' | Where-Object { $_ -and $_ -notin ($env:Path -split ';') })
                [array]::Reverse($addedPaths)
                $addedPaths >> $env:GITHUB_PATH
              }
            }
          }

      - name: Install the tools of uv.lock
        run: uv sync --frozen

      # The `env` context holds only variables the workflow sets, not the runner's process environment, so the image
      # version the runner provides in ImageVersion is copied into the workflow environment for the cache key. It may
      # be empty on a runner that does not set it; the key then simply has no image part.
      - name: Record the runner image version
        run: '"IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV'

      # Conan packages only, never a build tree. Conan keeps its package store in $CONAN_HOME/p. The key holds what
      # decides whether a stored package can be reused: the lockfile, conanfile.py, the operating system and CPU, the
      # compiler, the build type, and the runner image version (a new image can ship a new compiler patch release).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/conan-home/p
          key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ matrix.configuration }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('conan.lock', 'conanfile.py') }}

      # The steps below are the commands of Gate.check_cpu_preset in tools/check_commit.py, one step each, for the
      # preset `<os>-<configuration>-cpu`. The gate's own `cpu` step runs the debug and the release preset together
      # in one go, so the matrix cannot call it per configuration.
      - name: Detect the Conan profile
        run: uv run --frozen conan profile detect --exist-ok

      - name: Install the Conan packages
        run: >
          uv run --frozen conan install . --lockfile conan.lock -of out/conan/${{ env.PRESET }}
          -s build_type=${{ env.BUILD_TYPE }} -s compiler.cppstd=23 -s:b compiler.cppstd=23 --build=missing

      - name: Configure
        run: uv run --frozen cmake --preset ${{ env.PRESET }}

      - name: Build
        run: uv run --frozen cmake --build --preset ${{ env.PRESET }}

      # A debug build runs the unit tests only, as the gate at the speed `commit` does; the release build runs every
      # test. ctest labels are regular expressions, so `^unit$` is exact.
      - name: Test
        run: |
          if ($env:BUILD_TYPE -eq 'Debug') {
            'Functional tests are not run in a debug job: the release job and the local full gate run them.'
            uv run --frozen ctest --preset $env:PRESET --parallel 4 -L '^unit$'
          } else {
            uv run --frozen ctest --preset $env:PRESET --parallel 4
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # The CUDA compile reuses the gate's `cuda` step instead of retyping it. That step builds
  # tools/cuda-container/Dockerfile and runs the container script of tools/check_commit.py, so the image digest
  # (CUDA_IMAGE and the Dockerfile's FROM line) and the commands exist in one place and cannot drift from this job.
  # The digest is a multi-platform index (linux/arm64 and linux/amd64), checked with `docker buildx imagetools
  # inspect`. The gate picks `linux/amd64` on this x86-64 runner, so nothing is emulated. docker is on the ubuntu
  # runner already; the gate's `docker info` check passes there.
  cuda-compile:
    name: cuda-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # The gate needs only the Python standard library, so no development tool is installed on the runner. The
      # Conan packages and the build tree live in a Docker volume of this run and are fetched anew each time.
      - name: Gate step cuda
        run: uv run --frozen --no-dev python tools/check_commit.py --speed full --only cuda

  # Compile only, on Windows. The toolkit is version 13.4.1, the one of the Linux container (tools/cuda-container/
  # Dockerfile). NVIDIA publishes no Windows installer under that version, and the maintained setup action
  # (Jimver/cuda-toolkit) lists versions only up to 13.3.1, so the job downloads the redistributable archives
  # of release 13.4.1 (https://developer.download.nvidia.com/compute/cuda/redist/redistrib_13.4.1.json) of the
  # components that compiling and linking needs, checks the SHA-256 of each against the table below, and unpacks them
  # into one folder with the layout of an installed toolkit. That is the compiler (nvcc, crt, nvvm, ptx compiler,
  # fatbinary library, compiler advisor), the runtime (cudart with its headers and import library), the profiler API
  # header and the C++ core libraries. It needs no driver and no installer, so it also leaves out the Visual Studio
  # integration, which only MSBuild generators use; the presets use Ninja.
  # UNVERIFIED until it has run on GitHub: the set of components may miss one that nvcc or FindCUDAToolkit wants; the
  # failure would name the missing file.
  cuda-compile-windows:
    name: cuda-compile windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PRESET: windows-release-cuda
      CUDA_VERSION: "13.4.1"
      # The toolkit folder, kept by the cache below. It is outside the workspace so that no build step sees it as source.
      CUDA_PATH: C:\cuda-toolkit-13.4.1
      CONAN_HOME: ${{ github.workspace }}/out/conan-home
      UV_PYTHON_PREFERENCE: only-managed
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      # The same step as in the `cpu` job: Ninja does not start a developer environment, and nvcc needs `cl` on PATH.
      # The toolset is the newest of Visual Studio 2022, since this job does not pin the runner image.
      - name: Select the compiler (MSVC from Visual Studio 2022, x64)
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -or !$installation) { throw 'Visual Studio 2022 C++ tools are required.' }
          $devCmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $script = Join-Path $env:RUNNER_TEMP 'vsdevcmd-environment.cmd'
          @(
            "@echo off",
            "call `"$devCmd`" -no_logo -arch=x64 -host_arch=x64",
            "if errorlevel 1 exit /b 1",
            "set"
          ) | Set-Content -Path $script -Encoding ascii
          $variables = & cmd.exe /d /c $script
          if ($LASTEXITCODE) { throw 'VsDevCmd failed.' }
          $nativeVariables = @(
            'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion',
            'VisualStudioVersion', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion',
            'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_VER', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH'
          )
          foreach ($line in $variables) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ($name -in $nativeVariables) {
                "$name=$value" >> $env:GITHUB_ENV
              }
              if ($name -eq 'Path') {
                $addedPaths = @($value -split ';' | Where-Object { $_ -and $_ -notin ($env:Path -split ';') })
                [array]::Reverse($addedPaths)
                $addedPaths >> $env:GITHUB_PATH
              }
            }
          }

      # The key names the release, so the folder is downloaded once for as long as the version and the component list
      # below stay the same. Bump the `v1` when the list changes.
      - name: Restore the CUDA toolkit
        id: cuda-toolkit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CUDA_PATH }}
          key: cuda-toolkit-v1-${{ runner.os }}-${{ env.CUDA_VERSION }}

      - name: Install the CUDA toolkit (13.4.1 redistributable archives, no driver)
        if: steps.cuda-toolkit-cache.outputs.cache-hit != 'true'
        run: |
          # Path under compute/cuda/redist/ and SHA-256 of each archive, from redistrib_13.4.1.json.
          $archives = [ordered]@{
            'cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.4.59-archive.zip'                   = '06a4fe6ec543030c5e5a7b85493cda90612015d9fff2a54ed0227162c937ea46'
            'cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.4.59-archive.zip'                     = 'f969a0e3b086a48f940563cd1b965cb5197fd9540c79cc952b1abfa479f9ede7'
            'cuda_ctadvisor/windows-x86_64/cuda_ctadvisor-windows-x86_64-13.4.49-archive.zip'         = 'e9403ee381a0d543c0307d49f91dbdee8bb061236b234a1a55c3043a86299b83'
            'libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.4.59-archive.zip'                       = 'a7a07bcc21cc05bce83eedebcbcd9b9f5418c58316b0fa28a57cb2c548b29841'
            'libnvptxcompiler/windows-x86_64/libnvptxcompiler-windows-x86_64-13.4.59-archive.zip'     = '4de2e70b56ae5296b39317ebd55dbb814f2ac31506c4d3ef97bfbded1cdf8cc9'
            'libnvfatbin/windows-x86_64/libnvfatbin-windows-x86_64-13.4.49-archive.zip'               = '831af09019e56b54bc4d4364a0cf7947c688acb05e186a52f8c73662cbeb4a42'
            'cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.4.49-archive.zip'               = 'e6663f3d3e8949eedc2d5ab92c7c5b9fa3f2a222086d91c42bfc5a38bf2b0225'
            'cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.4.49-archive.zip'   = '34c38ea6ee834a070ee605799f4488d2a3b05246a36e57ff1d429b11a2a9cc03'
            'cccl/windows-x86_64/cccl-windows-x86_64-13.3.4.2.1-archive.zip'                          = 'ea3ebdd98d4d98819cc26b66bc5a0931004ed35ff18eea8b93e0bd2c8bfa5d7c'
          }
          $download = Join-Path $env:RUNNER_TEMP 'cuda-archives'
          New-Item -ItemType Directory -Force -Path $download, $env:CUDA_PATH | Out-Null
          foreach ($entry in $archives.GetEnumerator()) {
            $file = Join-Path $download (Split-Path $entry.Key -Leaf)
            Invoke-WebRequest -Uri "https://developer.download.nvidia.com/compute/cuda/redist/$($entry.Key)" -OutFile $file
            $actual = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "SHA-256 of $($entry.Key) is $actual, expected $($entry.Value)." }
            # Each archive holds one folder (bin, include, lib, nvvm, ...) named after itself; its contents go
            # into the toolkit folder, where the installer would put them.
            $unpacked = Join-Path $download ([IO.Path]::GetFileNameWithoutExtension($file))
            Expand-Archive -Path $file -DestinationPath $download -Force
            Copy-Item -Path (Join-Path $unpacked '*') -Destination $env:CUDA_PATH -Recurse -Force
          }

      # CUDA_PATH and CUDAToolkit_ROOT are what CMake's CUDA support and FindCUDAToolkit read; bin has nvcc and the
      # runtime DLL.
      - name: Use the CUDA toolkit
        run: |
          "CUDA_PATH=$env:CUDA_PATH" >> $env:GITHUB_ENV
          "CUDAToolkit_ROOT=$env:CUDA_PATH" >> $env:GITHUB_ENV
          Join-Path $env:CUDA_PATH 'bin' >> $env:GITHUB_PATH

      - name: Show the compilers
        run: |
          nvcc --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cl 2>&1 | Select-Object -First 1

      - name: Install the tools of uv.lock
        run: uv sync --frozen

      - name: Record the runner image version
        run: '"IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV'

      # Conan packages only, as in the `cpu` job, for the Release build type of this preset.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/conan-home/p
          key: conan-v1-${{ runner.os }}-${{ runner.arch }}-msvc-vs2022-cuda-Release-${{ env.IMAGE_VERSION }}-${{ hashFiles('conan.lock', 'conanfile.py') }}

      - name: Detect the Conan profile
        run: uv run --frozen conan profile detect --exist-ok

      - name: Install the Conan packages
        run: >
          uv run --frozen conan install . --lockfile conan.lock -of out/conan/${{ env.PRESET }}
          -s build_type=Release -s compiler.cppstd=23 -s:b compiler.cppstd=23 --build=missing

      - name: Configure
        run: uv run --frozen cmake --preset ${{ env.PRESET }}

      # Every target, no test: `ctest` is never called in this job.
      - name: Build
        run: uv run --frozen cmake --build --preset ${{ env.PRESET }}
