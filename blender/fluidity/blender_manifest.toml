schema_version = "1.0.0"
id = "fluidity"
version = "0.3.0"
name = "FluidiTy"
tagline = "Author liquid domains, materials and native point-cache playback"
maintainer = "FluidiTy contributors"
type = "add-on"
blender_version_min = "5.2.3"
platforms = ["windows-x64"]
license = ["SPDX:LicenseRef-FluidiTy-Internal"]

[permissions]
files = "Run the bundled solver and access the selected local cache"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "*.blend1"]
